name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm --filter @ramka/svelte build
      - run: pnpm check
      - run: pnpm --filter @ramka/svelte exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm --filter docs build
